version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Africa/Douala"
    target-branch: "dev"
    open-pull-requests-limit: 10
    reviewers:
      - "TheGoatIA"
    labels: ["dependabot", "flutter", "dependencies"]
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: "scope"
    groups:
      bloc:
        patterns: ["flutter_bloc", "bloc", "bloc_test", "equatable"]
      firebase:
        patterns: ["firebase_*"]
      codegen:
        patterns:
          [
            "build_runner",
            "freezed*",
            "json_serializable",
            "json_annotation",
            "injectable*",
            "chopper*",
            "drift*",
          ]
      testing:
        patterns: ["mocktail", "patrol*", "golden_toolkit", "integration_test"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Africa/Douala"
    target-branch: "dev"
    labels: ["dependabot", "flutter", "dependencies"]
    commit-message:
      prefix: "build(android)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Douala"
    target-branch: "dev"
    labels: ["dependabot", "dependencies", "ci-cd"]
    commit-message:
      prefix: "build(tooling)"
      prefix-development: "build(tooling)"
    groups:
      tooling:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Africa/Douala"
    target-branch: "dev"
    labels: ["dependabot", "ci-cd"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
