name: Mobile Deploy

# dev → distribution « staging » ; main → distribution « production ». Aucun déploiement ne se lance sans les secrets associés.
on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Vérification (format, analyse, tests)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      env_name: ${{ steps.version.outputs.env_name }}
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calcul de la version de déploiement (AAAAMMJJ.N)
        id: version
        run: |
          git fetch --tags --force
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then ENV_NAME="production"; else ENV_NAME="staging"; fi
          DATE=$(date -u +%Y%m%d)
          LAST=$( (git tag -l "v${DATE}.*" "staging-${DATE}.*" || true) | sed -E "s/^(v|staging-)${DATE}\.//" | sort -n | tail -1)
          VERSION="${DATE}.$(( ${LAST:-0} + 1 ))"
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Version ${VERSION} (${ENV_NAME}) — app ${APP_VERSION}+${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed --line-length 100 lib/core lib/di lib/features lib/routes lib/main.dart test integration_test
      - name: Cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('lib/**/*.dart') }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: cp .env.example .env
      - run: flutter analyze --fatal-warnings
      - run: flutter test

  android:
    name: Build Android (${{ needs.verify.outputs.env_name }})
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ needs.verify.outputs.env_name }}
    env:
      ENV_NAME: ${{ needs.verify.outputs.env_name }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('lib/**/*.dart') }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Fichier .env
        run: |
          cp .env.example .env
          API_URL="${{ env.ENV_NAME == 'production' && secrets.API_BASE_URL_PROD || secrets.API_BASE_URL_STAGING }}"
          if [ -n "$API_URL" ]; then
            sed -i "s|^API_BASE_URL=.*|API_BASE_URL=${API_URL}|" .env
          fi
          sed -i "s|^APP_ENV=.*|APP_ENV=${ENV_NAME}|" .env
      - name: Restaurer les secrets de signature (si présents)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json; fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            cat > android/key.properties <<EOF2
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF2
          else
            echo "::notice::Keystore absent : APK signé avec la clé de debug (distribution interne uniquement)."
          fi
      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --build-name=${{ needs.verify.outputs.app_version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_ENV=${ENV_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ needs.verify.outputs.env_name }}-${{ needs.verify.outputs.version }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Distribution Firebase App Distribution (si configurée)
        if: env.FIREBASE_SA != '' && env.FIREBASE_APP_ID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: android-${{ needs.verify.outputs.env_name }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "${{ needs.verify.outputs.env_name }} ${{ needs.verify.outputs.version }} — ${{ github.event.head_commit.message }}"
      - name: Nettoyage des secrets
        if: always()
        run: rm -f android/app/release.jks android/key.properties android/app/google-services.json .env

  ios:
    name: Build iOS (${{ needs.verify.outputs.env_name }})
    needs: verify
    runs-on: macos-latest
    environment: ${{ needs.verify.outputs.env_name }}
    env:
      ENV_NAME: ${{ needs.verify.outputs.env_name }}
      IOS_CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'ios/Podfile') }}
          restore-keys: pods-${{ runner.os }}-
      - name: Cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('lib/**/*.dart') }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: |
          cp .env.example .env
          sed -i '' "s|^APP_ENV=.*|APP_ENV=${ENV_NAME}|" .env
      - name: Build iOS sans signature (vérification de compilation)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.verify.outputs.app_version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_ENV=${ENV_NAME}
      - name: Signature, IPA et TestFlight
        if: env.IOS_CERT_B64 != ''
        env:
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT=$RUNNER_TEMP/cert.p12; PP=$RUNNER_TEMP/profile.mobileprovision; KC=$RUNNER_TEMP/app.keychain-db
          echo -n "$IOS_CERT_B64" | base64 --decode -o "$CERT"
          echo -n "$PROFILE_B64" | base64 --decode -o "$PP"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles && cp "$PP" ~/Library/MobileDevice/Provisioning\ Profiles/
          flutter build ipa --release --build-name=${{ needs.verify.outputs.app_version }} --build-number=${{ github.run_number }}\
            --dart-define=APP_ENV=${ENV_NAME}
      - name: Upload TestFlight
        if: env.IOS_CERT_B64 != ''
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      - name: Nettoyage du trousseau
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app.keychain-db" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision .env

  tag:
    name: Tag de version
    needs: [verify, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag git
        run: |
          if [ "${{ needs.verify.outputs.env_name }}" = "production" ]; then TAG="v${{ needs.verify.outputs.version }}"; else TAG="staging-${{ needs.verify.outputs.version }}"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Mobile ${{ needs.verify.outputs.env_name }} ${{ needs.verify.outputs.version }}"
          git push origin "$TAG"

  notify:
    name: Notification Slack
    needs: [verify, android, ios]
    if: always() && needs.verify.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Slack (si SLACK_WEBHOOK_URL est défini)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "Slack non configuré"; exit 0; }
          S="${{ needs.android.result }}/${{ needs.ios.result }}"
          jq -n --arg t "Mobile ${{ needs.verify.outputs.env_name }} ${{ needs.verify.outputs.version }} — Android/iOS: $S — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{text:$t}' \
            | curl -sf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
