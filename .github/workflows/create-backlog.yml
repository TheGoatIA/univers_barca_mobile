name: Créer le backlog (issues détaillées)

# Création idempotente des issues décrites dans .github/backlog/ (étiquettes, jalons, issues, épopées).
# Relançable à volonté : les issues déjà créées (identifiées par leur code entre crochets) sont ignorées.
on:
  # Déclenchement automatique : modifier .github/backlog/run.json (options ci-dessous) puis pousser sur main
  push:
    branches: [main]
    paths: [".github/backlog/run.json"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation (n'écrit rien)"
        type: boolean
        default: false
      only:
        description: "Codes à créer uniquement (séparés par des virgules, vide = tout)"
        required: false
        default: ""
      limit:
        description: "Nombre maximum d'issues à créer pendant ce run (vide = illimité)"
        required: false
        default: ""

permissions:
  issues: write
  contents: read

concurrency:
  group: create-backlog
  cancel-in-progress: false

jobs:
  create:
    name: Créer les issues
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Créer / synchroniser
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BACKLOG_ASSIGNEE: BorisGautier
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          DRY="${{ inputs.dry_run }}"; ONLY="${{ inputs.only }}"; LIMIT="${{ inputs.limit }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            DRY=$(jq -r '.dry_run // false' .github/backlog/run.json)
            ONLY=$(jq -r '.only // ""' .github/backlog/run.json)
            LIMIT=$(jq -r '.limit // ""' .github/backlog/run.json)
          fi
          ARGS=""
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "$ONLY" ] && ARGS="$ARGS --only=$ONLY"
          [ -n "$LIMIT" ] && ARGS="$ARGS --limit=$LIMIT"
          echo "Options : $ARGS"
          node .github/backlog/create-backlog.mjs $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backlog-map
          path: .github/backlog/map.json
          if-no-files-found: ignore
