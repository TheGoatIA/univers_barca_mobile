name: Mobile CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Qualité (format, analyse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatage (dart format)
        run: dart format --output=none --set-exit-if-changed --line-length 100 lib test integration_test
      - name: Génération de code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs
      - run: cp .env.example .env
      - name: Analyse statique (warnings fatals)
        run: flutter analyze --fatal-warnings

  commitlint:
    name: Commits conventionnels
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: commitlint
        run: npx --yes -p @commitlint/cli -p @commitlint/config-conventional commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  tests:
    name: Tests unitaires & widgets + couverture
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: cp .env.example .env
      - run: flutter test --coverage --reporter=github
      - name: Seuil de couverture (≥ 60 %)
        run: |
          python3 - << 'PY'
          import re, sys
          c = open('coverage/lcov.info').read()
          da = re.findall(r'DA:\d+,(\d+)', c)
          pct = sum(1 for v in da if v != '0') * 100 // max(len(da), 1)
          print(f'Couverture : {pct} % ({len(da)} lignes instrumentées)')
          sys.exit(0 if pct >= 60 else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: cp .env.example .env
      - run: flutter build apk --debug --dart-define=APP_ENV=development
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3

  build-ios:
    name: Build iOS (debug, sans signature)
    runs-on: macos-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: cp .env.example .env
      - run: flutter build ios --debug --no-codesign --dart-define=APP_ENV=development

  security:
    name: Sécurité (secrets, vulnérabilités)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog (secrets)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
      - name: Trivy (système de fichiers)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
